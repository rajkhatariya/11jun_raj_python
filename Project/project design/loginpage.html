<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM ISP - Login & Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animations */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .fade-slide {
      animation: fadeSlide 0.5s ease-out;
    }
    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

  <div class="glass shadow-xl rounded-lg p-8 w-full max-w-lg transition-transform transform hover:scale-105 hover:shadow-2xl text-white">
    <!-- Login Form -->
    <div id="loginForm" class="fade-slide">
      <h2 class="text-3xl font-bold text-center mb-6">Login</h2>
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Email</label>
          <input type="email" placeholder="you@example.com" 
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <div>
          <label class="block mb-1 font-medium">Password</label>
          <input type="password" placeholder="••••••••" 
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <button type="submit" 
                class="w-full bg-gradient-to-r from-pink-500 to-indigo-500 text-white py-2 rounded font-semibold text-lg shadow-md hover:shadow-lg transform hover:scale-105 transition-all duration-300">
          Login
        </button>
      </form>
      <p class="text-sm text-center mt-4">Don't have an account? 
        <button onclick="showRegister()" class="text-pink-300 font-semibold hover:text-white transition-all">Register</button>
      </p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden fade-slide">
      <h2 class="text-3xl font-bold text-center mb-6">Create Account</h2>
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Full Name</label>
          <input type="text" placeholder="John Doe"
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <div>
          <label class="block mb-1 font-medium">Email</label>
          <input type="email" placeholder="example@domain.com"
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <div>
          <label class="block mb-1 font-medium">Password</label>
          <input type="password" placeholder="••••••••"
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <div>
          <label class="block mb-1 font-medium">Confirm Password</label>
          <input type="password" placeholder="••••••••"
                 class="w-full border border-gray-300 bg-white/20 text-white placeholder-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all" 
                 required>
        </div>
        <button type="submit" 
                class="w-full bg-gradient-to-r from-pink-500 to-indigo-500 text-white py-2 rounded font-semibold text-lg shadow-md hover:shadow-lg transform hover:scale-105 transition-all duration-300">
          Register
        </button>
      </form>
      <p class="text-sm text-center mt-4">Already have an account? 
        <button onclick="showLogin()" class="text-pink-300 font-semibold hover:text-white transition-all">Login</button>
      </p>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    }
    function showLogin() {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    }
  </script>

</body>
</html>
