{% extends 'base.html' %}
{% block title %}Login | SkillSphere{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow-md p-8 rounded-lg">
  <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="mb-4 p-3 rounded text-white {% if message.tags == 'success' %}bg-green-500{% else %}bg-red-500{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block mb-2">Email</label>
      <input type="email" name="email" class="w-full border rounded px-3 py-2" required>
    </div>
    <div class="mb-4">
      <label class="block mb-2">Password</label>
      <input type="password" name="password" class="w-full border rounded px-3 py-2" required>
    </div>
    <button class="bg-blue-600 text-white w-full py-2 rounded mt-4">Login</button>
  </form>

  <p class="mt-4 text-center">
    Don’t have an account? <a href="{% url 'signup' %}" class="text-blue-600">Sign up</a>
  </p>
</div>
{% endblock %}
